name: Deploy client to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            clients/package-lock.json
            student-portal-template/package-lock.json

      - name: Install client dependencies
        working-directory: clients
        run: npm ci

      - name: Build client
        working-directory: clients
        run: npm run build
        env:
          # clients/.env keeps "/api" for local dev, but the Pages origin has no
          # API and no proxy, so the deployed build must call the service directly.
          VITE_API_URL: https://cec-portal-api-5i1q.onrender.com

      - name: Install template dependencies
        working-directory: student-portal-template
        run: npm ci

      - name: Build template
        working-directory: student-portal-template
        run: npm run build

      # Portal at "/" and the standalone template at "/template/".
      - name: Assemble Pages site
        run: |
          mkdir -p pages
          cp -r clients/dist/. pages/
          mkdir -p pages/template
          cp -r student-portal-template/dist/. pages/template/
          touch pages/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
